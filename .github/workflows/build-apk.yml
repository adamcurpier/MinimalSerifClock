name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalSerifClock-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish versioned APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          TAG="v${VERSION}"
          ASSET="MinimalSerifClock-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "Minimal Serif Clock ${TAG}" --notes "Installable APK for Minimal Serif Clock ${TAG}."
          fi
      - name: Store APK temporarily for ChatGPT handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          TAG="v${VERSION}"
          ASSET="MinimalSerifClock-${TAG}.apk"
          PATH_IN_REPO="builds/${ASSET}.b64"
          B64=$(base64 -w 0 app/build/outputs/apk/debug/app-debug.apk)
          EXISTING_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" -f message="Store ${TAG} APK handoff [skip ci]" -f content="$B64" -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" -f message="Store ${TAG} APK handoff [skip ci]" -f content="$B64" >/dev/null
          fi
